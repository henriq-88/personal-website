packages:
  - apps/**
  - packages/**
  - packages/config/*
peerDependencyRules:
  allowedVersions:
    eslint: ">=10"
    next: "16.4.6"
    react: "19.3.1"
    react-dom: "19.3.1"
minimumReleaseAgeExclude:
  - '@hookform/resolvers@7.0.6'
  - '@turbo/darwin-64@2.11.11'
  - '@turbo/darwin-arm64@2.11.11'
  - '@turbo/linux-64@2.11.11'
  - '@turbo/linux-arm64@2.11.11'
  - '@turbo/windows-64@2.11.11'
  - '@turbo/windows-arm64@2.11.11'
  - eslint-plugin-turbo@2.11.11
  - framer-motion@14.13.0
  - motion-dom@14.13.0
  - prettier@3.10.1
  - turbo@2.11.11
allowBuilds:
  '@parcel/watcher': true
